# El puerto lo pone arrancar.sh con $PORT (Render usa 10000).
server {
    listen __PORT__ default_server;
    listen [::]:__PORT__ default_server;
    server_name _;
    root /app/apps/web/public;
    index index.php;
    charset utf-8;

    # Los Excel que se importan pesan hasta 5 MB.
    client_max_body_size 8m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location /build/ {
        expires max;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Con 0.1 CPU un import o la cuadrícula de una corrida grande pueden tardar.
        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
