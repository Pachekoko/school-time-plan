; Encima de php.ini-production.
expose_php = Off
memory_limit = 256M
max_execution_time = 120
; Los Excel que se importan pesan hasta 5 MB.
upload_max_filesize = 6M
post_max_size = 8M

; El código no cambia dentro del contenedor.
opcache.enable = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
